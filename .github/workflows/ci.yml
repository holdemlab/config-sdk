name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: "v2.15"

  test:
    needs: [lint]
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: go test -count=1 -race ./...

  coverage:
    needs: [test]
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"

      - name: Run tests with coverage
        run: |
          go test -count=1 -coverprofile=coverage.out $(go list ./... | grep -v /examples/)

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 90" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 90% threshold"
            exit 1
          fi

  compat:
    needs: [coverage]
    name: AES-GCM Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"

      - name: Run compatibility test
        run: go test -count=1 -run TestAESGCMServerCompatibility ./...

  auto-tag:
    name: Auto Tag and Release
    needs: [compat]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: auto-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history + tags for bump analysis

      # Bump rules live in scripts/auto-tag.sh (see CONTRIBUTING.md, section 7).
      # Tags created with GITHUB_TOKEN do not trigger release.yml, so the
      # release is created by the script itself.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/auto-tag.sh
